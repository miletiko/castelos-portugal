<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Castelo — Castelos de Portugal</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏰</text></svg>">
<script>
(function () {
  try {
    var theme = localStorage.getItem("castelos:theme");
    if (theme) document.documentElement.setAttribute("data-theme", theme);
    var font = localStorage.getItem("castelos:font");
    if (font) document.documentElement.setAttribute("data-font", font);
  } catch (e) {}
})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700;800&family=Lora:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css?v=4" />
</head>
<body>
  <header class="site-header">
    <a href="index.html" class="brand">
      <span class="crest">🏰</span>
      <span>Castelos de Portugal<small>mapa &amp; roteiro de visitas</small></span>
    </a>
    <div class="header-right">
      <div class="header-stats">
        <div class="header-stat">
          <span class="num" id="stat-total">0</span>
          <span class="lbl">Castelos</span>
        </div>
        <div class="header-stat visited">
          <span class="num" id="stat-visited">0</span>
          <span class="lbl">Visitados</span>
        </div>
      </div>
      <div class="header-controls">
        <select id="font-select" class="font-select" title="Tipo de letra">
          <option value="">Moderno</option>
          <option value="classic">Clássico</option>
          <option value="direct">Direto</option>
        </select>
        <button id="theme-toggle" class="icon-btn" title="Alternar modo claro/escuro">🌙</button>
      </div>
    </div>
  </header>

  <div class="detail-wrap" id="detail-wrap">
    <a href="index.html" class="back-link">← Voltar ao mapa</a>
    <div id="content">Carregando…</div>
  </div>

  <div id="lightbox">
    <button class="close-x" id="lightbox-close">&times;</button>
    <img id="lightbox-img" src="" alt="" />
  </div>

  <div id="toast"></div>

  <script src="common.js?v=4"></script>
  <script src="storage.js?v=4"></script>
  <script src="castle.js?v=4"></script>
</body>
</html>
