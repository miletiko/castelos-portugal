<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Castelos de Portugal</title>
<meta name="description" content="Mapa interativo de todos os castelos de Portugal, com informação histórica e registo de visitas.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏰</text></svg>">
<script>
(function () {
  try {
    var theme = localStorage.getItem("castelos:theme");
    if (theme) document.documentElement.setAttribute("data-theme", theme);
    var font = localStorage.getItem("castelos:font");
    if (font) document.documentElement.setAttribute("data-font", font);
  } catch (e) {}
})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=Lora:wght@400;500;600;700&family=Cormorant+Garamond:wght@500;600;700&family=EB+Garamond:wght@400;500;600;700&family=Cinzel:wght@600;700;800&family=Crimson+Text:wght@400;600;700&family=Libre+Baskerville:wght@400;700&family=PT+Serif:wght@400;700&family=Spectral:wght@500;600;700&family=Cardo:wght@400;700&family=Bitter:wght@500;600;700&family=Old+Standard+TT:wght@400;700&family=Merriweather:wght@400;700;900&family=Domine:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<link rel="stylesheet" href="styles.css?v=6" />
</head>
<body>
  <header class="site-header">
    <a href="index.html" class="brand">
      <span class="crest">🏰</span>
      <span>Castelos de Portugal<small>mapa &amp; roteiro de visitas</small></span>
    </a>
    <div class="header-right">
      <div class="header-stats">
        <div class="header-stat">
          <span class="num" id="stat-total">0</span>
          <span class="lbl">Castelos</span>
        </div>
        <div class="header-stat visited">
          <span class="num" id="stat-visited">0</span>
          <span class="lbl">Visitados</span>
        </div>
      </div>
      <div class="header-controls">
        <select id="font-select" class="font-select" title="Tipo de letra">
          <option value="">Clássico (Playfair)</option>
          <option value="garamond">Garamond Antigo</option>
          <option value="monumental">Monumental (Cinzel)</option>
          <option value="baskerville">Baskerville</option>
          <option value="spectral">Spectral</option>
          <option value="cardo">Cardo Histórico</option>
          <option value="slab">Pedra (Bitter)</option>
          <option value="oldstandard">Old Standard</option>
          <option value="merriweather">Merriweather</option>
          <option value="domine">Domine</option>
        </select>
        <button id="theme-toggle" class="icon-btn" title="Alternar modo claro/escuro">🌙</button>
      </div>
    </div>
  </header>

  <div id="app">
    <div id="map"></div>
    <aside id="sidebar">
      <div class="sidebar-controls">
        <div class="search-box">
          <input type="text" id="search-input" placeholder="Procurar castelo ou concelho…" autocomplete="off" />
        </div>
        <div class="filter-row">
          <select id="district-filter">
            <option value="">Todos os distritos</option>
          </select>
          <span class="toggle-chip" id="visited-filter">✓ Só visitados</span>
        </div>
      </div>
      <div id="castle-list"></div>
    </aside>
  </div>

  <div id="toast"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="common.js?v=6"></script>
  <script src="storage.js?v=6"></script>
  <script src="map.js?v=6"></script>
</body>
</html>
